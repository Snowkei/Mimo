# ===========================================
# Mimo 博客 - 自动部署到 Cloudflare Pages
# ===========================================
# 需要在 GitHub 仓库 Settings → Secrets 中配置：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（需要 Pages 权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#   CLOUDFLARE_PROJECT_NAME - Pages 项目名（默认 mimo-blog）
#
# 可选（图床功能）：
#   GITHUB_TOKEN, GITHUB_OWNER, GITHUB_REPO, R2_* 等

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'mimo-blog' }}
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$(git log -1 --pretty=format:'%s')" \
            --branch="${{ github.ref_name }}"

      - name: Set runtime secrets
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'mimo-blog' }}
        run: |
          set_secret() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "Setting $key..."
              echo "$val" | npx wrangler@latest pages secret put "$key" \
                --project-name="$PROJECT_NAME" 2>&1 | grep -v "wrangler" || true
            fi
          }

          set_secret "GITHUB_TOKEN"          "${{ secrets.GITHUB_TOKEN }}"
          set_secret "GITHUB_OWNER"          "${{ secrets.GITHUB_OWNER }}"
          set_secret "GITHUB_REPO"           "${{ secrets.GITHUB_REPO }}"
          set_secret "GITHUB_BRANCH"         "${{ secrets.GITHUB_BRANCH }}"
          set_secret "GITHUB_CONTENT_DIR"    "${{ secrets.GITHUB_CONTENT_DIR }}"
          set_secret "IMAGE_HOST_TYPE"       "${{ secrets.IMAGE_HOST_TYPE }}"
          set_secret "R2_ACCOUNT_ID"         "${{ secrets.R2_ACCOUNT_ID }}"
          set_secret "R2_ACCESS_KEY_ID"      "${{ secrets.R2_ACCESS_KEY_ID }}"
          set_secret "R2_SECRET_ACCESS_KEY"  "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          set_secret "R2_BUCKET"             "${{ secrets.R2_BUCKET }}"
          set_secret "R2_DOMAIN"             "${{ secrets.R2_DOMAIN }}"
          set_secret "R2_PREFIX"             "${{ secrets.R2_PREFIX }}"

          echo "✅ Done"
